<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siber Kasa v4.1</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b1117;
            --frame-color: #161b22;
            --neon-blue: #00d2ff;
            --cyber-green: #39FF14;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --input-bg: #1c2128;
            --danger: #ff4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: env(safe-area-inset-top) 15px 80px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header & Total Section */
        .header {
            width: 100%;
            max-width: 500px;
            background: var(--frame-color);
            border: 1px solid var(--neon-blue);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .total-title { font-size: 0.85rem; color: var(--text-dim); font-weight: bold; letter-spacing: 1px; }
        .total-value { font-size: 2.2rem; color: var(--cyber-green); font-family: 'Consolas', monospace; margin: 10px 0; font-weight: bold; }

        /* Asset Grid */
        .section-title { width: 100%; max-width: 500px; margin: 25px 0 10px 5px; font-size: 1rem; color: var(--neon-blue); font-weight: bold; }
        
        .asset-card {
            width: 100%;
            max-width: 500px;
            background: var(--frame-color);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .asset-info { flex-grow: 1; }
        .asset-name { font-size: 0.9rem; font-weight: bold; }
        .asset-price { font-size: 0.75rem; color: var(--text-dim); }

        input {
            width: 80px;
            background: var(--input-bg);
            border: 1px solid #30363d;
            color: var(--cyber-green);
            padding: 10px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            text-align: center;
            font-size: 1rem;
        }

        input:focus { outline: 2px solid var(--neon-blue); border: none; }

        .asset-tl { width: 110px; text-align: right; font-weight: bold; color: var(--text-main); font-size: 0.9rem; }

        /* Rates Section */
        .rates-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .rate-box {
            min-width: 120px;
            background: var(--input-bg);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #30363d;
        }

        .rate-label { font-size: 0.7rem; color: var(--text-dim); display: block; }
        .rate-val { font-size: 0.9rem; font-weight: bold; color: var(--neon-blue); }

        /* Chart Area */
        .chart-container {
            width: 100%;
            max-width: 500px;
            background: var(--frame-color);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
        }

        /* Buttons */
        .btn-main {
            width: 100%;
            max-width: 500px;
            height: 50px;
            background: var(--neon-blue);
            color: var(--bg-color);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:active { transform: scale(0.98); background: var(--cyber-green); }

        /* Milestone Table */
        .milestone-list {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }

        .milestone-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #30363d;
            font-size: 0.85rem;
        }

        .footer { margin-top: 30px; font-size: 0.7rem; color: var(--text-dim); text-align: center; }

    </style>
</head>
<body>

    <div class="header">
        <div class="total-title">TOPLAM PORTFÖY DEĞERİ (TL)</div>
        <div id="total-val" class="total-value">0,00 TL</div>
        <div id="status" style="font-size: 0.6rem; color: var(--text-dim);">Senkronize ediliyor...</div>
    </div>

    <div class="section-title">CANLI PİYASA</div>
    <div class="rates-container">
        <div class="rate-box"><span class="rate-label">USD/TRY</span><span id="rate-usd" class="rate-val">---</span></div>
        <div class="rate-box"><span class="rate-label">GRAM ALTIN</span><span id="rate-gram" class="rate-val">---</span></div>
        <div class="rate-box"><span class="rate-label">ÇEYREK</span><span id="rate-ceyrek" class="rate-val">---</span></div>
    </div>

    <div class="section-title">VARLIKLARIM</div>
    <div id="asset-list">
        </div>

    <div class="chart-container">
        <canvas id="growthChart"></canvas>
    </div>

    <button class="btn-main" onclick="saveMilestone()">AYLIK DEĞİŞİMİ KAYDET (MILESTONE)</button>

    <div class="section-title">AYLIK KAYITLAR</div>
    <div id="milestone-list" class="milestone-list"></div>

    <div class="footer">Siber Kasa v4.1 - Developed by Mustafa Üner</div>

    <script>
        const API_KEY = '3cc3d712b6fd1fdc401607b8'; // Örnek API Key (Kendi key'inizi alabilirsiniz)
        const ASSET_TYPES = [
            { id: 'usd', name: 'Dolar ($)', unit: 'USD' },
            { id: 'gram', name: 'Gram Altın', unit: 'GR' },
            { id: 'ceyrek', name: 'Çeyrek Altın', unit: 'ADET' },
            { id: 'nakit', name: 'Nakit (TL)', unit: 'TL' }
        ];

        let rates = { usd: 0, gram: 0, ceyrek: 0 };
        let myAssets = JSON.parse(localStorage.getItem('assets')) || { usd: 0, gram: 0, ceyrek: 0, nakit: 0 };
        let history = JSON.parse(localStorage.getItem('history')) || [];
        let milestones = JSON.parse(localStorage.getItem('milestones')) || [];

        // Başlangıç
        function init() {
            renderAssets();
            fetchRates();
            renderMilestones();
            renderChart();
            setInterval(fetchRates, 60000); // 1 dk bir güncelle
        }

        async function fetchRates() {
            try {
                // Not: Döviz için public API, Altın için ise kur dönüşümü simülasyonu (veya özel gold api)
                const res = await fetch(`https://v6.exchangerate-api.com/v6/${API_KEY}/latest/USD`);
                const data = await res.json();
                
                rates.usd = data.conversion_rates.TRY;
                // Altın fiyatları için demo amaçlı rasyo (Gerçekte altın API kullanılmalı)
                // Ons Altın / 31.10 * USD/TRY hesabı gibi.
                rates.gram = 2505.50; // Örnek sabit (Gerçek API ile değiştirilebilir)
                rates.ceyrek = rates.gram * 1.63; 

                document.getElementById('rate-usd').innerText = rates.usd.toFixed(2) + ' ₺';
                document.getElementById('rate-gram').innerText = rates.gram.toFixed(2) + ' ₺';
                document.getElementById('rate-ceyrek').innerText = rates.ceyrek.toFixed(2) + ' ₺';
                
                document.getElementById('status').innerText = 'Son Güncelleme: ' + new Date().toLocaleTimeString();
                calculateTotal();
            } catch (e) {
                document.getElementById('status').innerText = 'Bağlantı Hatası!';
            }
        }

        function renderAssets() {
            const container = document.getElementById('asset-list');
            container.innerHTML = '';
            ASSET_TYPES.forEach(asset => {
                const div = document.createElement('div');
                div.className = 'asset-card';
                div.innerHTML = `
                    <div class="asset-info">
                        <div class="asset-name">${asset.name}</div>
                        <div class="asset-price" id="price-${asset.id}">---</div>
                    </div>
                    <input type="number" step="0.01" value="${myAssets[asset.id]}" 
                        oninput="updateAsset('${asset.id}', this.value)" placeholder="0">
                    <div class="asset-tl" id="tl-${asset.id}">0,00 ₺</div>
                `;
                container.appendChild(div);
            });
        }

        function updateAsset(id, val) {
            myAssets[id] = parseFloat(val) || 0;
            localStorage.setItem('assets', JSON.stringify(myAssets));
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            
            // USD
            const usdTL = myAssets.usd * rates.usd;
            document.getElementById('tl-usd').innerText = usdTL.toLocaleString('tr-TR') + ' ₺';
            total += usdTL;

            // Gram
            const gramTL = myAssets.gram * rates.gram;
            document.getElementById('tl-gram').innerText = gramTL.toLocaleString('tr-TR') + ' ₺';
            total += gramTL;

            // Çeyrek
            const ceyrekTL = myAssets.ceyrek * rates.ceyrek;
            document.getElementById('tl-ceyrek').innerText = ceyrekTL.toLocaleString('tr-TR') + ' ₺';
            total += ceyrekTL;

            // Nakit
            document.getElementById('tl-nakit').innerText = myAssets.nakit.toLocaleString('tr-TR') + ' ₺';
            total += myAssets.nakit;

            document.getElementById('total-val').innerText = total.toLocaleString('tr-TR', {minimumFractionDigits: 2}) + ' ₺';
            
            saveDailyData(total);
        }

        function saveDailyData(total) {
            const today = new Date().toISOString().split('T')[0];
            const lastEntry = history[history.length - 1];
            
            if (!lastEntry || lastEntry.date !== today) {
                history.push({ date: today, value: total });
            } else {
                lastEntry.value = total;
            }
            localStorage.setItem('history', JSON.stringify(history.slice(-30))); // Son 30 gün
        }

        function saveMilestone() {
            const total = document.getElementById('total-val').innerText;
            const now = new Date();
            const record = {
                date: now.toLocaleDateString('tr-TR'),
                value: total,
                details: {...myAssets}
            };
            milestones.unshift(record);
            localStorage.setItem('milestones', JSON.stringify(milestones));
            renderMilestones();
            alert("Aylık Milestone başarıyla kaydedildi!");
        }

        function renderMilestones() {
            const container = document.getElementById('milestone-list');
            container.innerHTML = milestones.map(m => `
                <div class="milestone-item">
                    <span>${m.date}</span>
                    <span style="color:var(--cyber-green); font-weight:bold;">${m.value}</span>
                </div>
            `).join('');
        }

        function renderChart() {
            const ctx = document.getElementById('growthChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map(h => h.date.split('-')[2]),
                    datasets: [{
                        label: 'Portföy (Günlük)',
                        data: history.map(h => h.value),
                        borderColor: '#00d2ff',
                        backgroundColor: 'rgba(0, 210, 255, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#1c2128' }, ticks: { color: '#8b949e' } },
                        x: { grid: { display: false }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
