<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Siber Kasa v9.1</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1117">
    <style>
        :root { --bg: #0b1117; --card: #161b22; --blue: #00d2ff; --green: #39FF14; --text: #c9d1d9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 500px; background: var(--card); border: 1px solid var(--blue); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .total { font-size: 2.2rem; color: var(--green); font-family: monospace; font-weight: bold; }
        .asset-card { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        input { width: 90px; background: #1c2128; border: 1px solid #333; color: var(--green); padding: 10px; border-radius: 8px; text-align: center; font-size: 1rem; }
        .rates { display: flex; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 15px; }
        .rate-box { flex:1; background: var(--card); padding: 10px; border-radius: 10px; text-align: center; font-size: 0.8rem; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 0.8rem; opacity: 0.7;">TOPLAM VARLIK (TL)</div>
        <div id="total-val" class="total">0,00 TL</div>
        <div id="status" style="font-size:0.6rem; margin-top:10px; color: var(--blue);">Banka Verileri Senkronize Ediliyor...</div>
    </div>

    <div class="rates">
        <div class="rate-box">İş Bankası USD<br><b id="rate-usd">...</b></div>
        <div class="rate-box">YK Gram<br><b id="rate-gram">...</b></div>
        <div class="rate-box">Serbest Çeyrek<br><b id="rate-ceyrek">...</b></div>
    </div>

    <div id="asset-list" style="width:100%; max-width:500px;"></div>

    <button onclick="saveMilestone()" style="width:100%; max-width:500px; height:55px; background:var(--blue); border:none; border-radius:15px; margin-top:15px; font-weight:bold; color:#000;">AYLIK KAYIT OLUŞTUR</button>

    <div id="milestone-list" style="width:100%; max-width:500px; margin-top:20px;"></div>

    <script>
        // KENDİ GOOGLE SCRIPT URL'Nİ BURAYA YAPIŞTIR
        const GOOGLE_PROXY_URL = "https://script.google.com/macros/s/AKfycbxd8iKLp5urDIwyXRmnHAjqrxjQqfeXerSozDDOFTdzbAf3vhta6-7FvNdJBjwgN4B5Iw/exec";
        
        // Yapı Kredi'nin dijital altın makas farkını simüle eden katsayı (~%1.3 indirim)
        const YAPIKREDI_KATSAYISI = 0.9868;

        let rates = { usd: 0, gram: 0, ceyrek: 0 };
        let myAssets = JSON.parse(localStorage.getItem('assets')) || { usd: 0, gram: 0, ceyrek: 0, nakit: 0 };

        async function fetchRates() {
            try {
                const response = await fetch(GOOGLE_PROXY_URL);
                const data = await response.json();
                
                const parse = (v) => {
                    if(!v) return 0;
                    return parseFloat(v.replace(/\./g, "").replace(",", ".")) || 0;
                };
                
                // USD (İş Bankası / Serbest piyasa birebir uyar)
                rates.usd = parse(data["USD"]["Alış"]);
                
                // GRAM ALTIN (Serbest piyasa "gram-has-altin" değerini Yapı Kredi dijital fiyatına dönüştür)
                let serbestGram = parse(data["gram-has-altin"]["Alış"]);
                rates.gram = serbestGram * YAPIKREDI_KATSAYISI; 
                
                // ÇEYREK ALTIN (Genelde fiziki tutulduğu için serbest piyasa değeri korunur)
                rates.ceyrek = parse(data["ceyrek-altin"]["Alış"]);

                document.getElementById('rate-usd').innerText = rates.usd.toFixed(2) + " ₺";
                document.getElementById('rate-gram').innerText = rates.gram.toFixed(2) + " ₺";
                document.getElementById('rate-ceyrek').innerText = rates.ceyrek.toFixed(0) + " ₺";
                
                document.getElementById('status').innerText = "Veri Akışı Sağlandı: " + new Date().toLocaleTimeString();
                calculateTotal();
            } catch (e) {
                document.getElementById('status').innerText = "Veri Ayrıştırma Hatası!";
                console.error(e);
            }
        }

        function renderAssets() {
            const container = document.getElementById('asset-list');
            const types = [{id:'usd', n:'Dolar ($)'}, {id:'gram', n:'Gram Altın'}, {id:'ceyrek', n:'Çeyrek Altın'}, {id:'nakit', n:'Nakit (TL)'}];
            container.innerHTML = '';
            types.forEach(a => {
                const div = document.createElement('div');
                div.className = 'asset-card';
                div.innerHTML = `<div>${a.n}</div><input type="number" inputmode="decimal" value="${myAssets[a.id]}" oninput="updateAsset('${a.id}', this.value)"> <div id="tl-${a.id}" style="font-weight:bold; width:100px; text-align:right;">0,00 ₺</div>`;
                container.appendChild(div);
            });
        }

        function updateAsset(id, v) { 
            myAssets[id] = parseFloat(v) || 0; 
            localStorage.setItem('assets', JSON.stringify(myAssets)); 
            calculateTotal(); 
        }

        function calculateTotal() {
            const r = { usd: myAssets.usd * rates.usd, gram: myAssets.gram * rates.gram, ceyrek: myAssets.ceyrek * rates.ceyrek, nakit: myAssets.nakit };
            Object.keys(r).forEach(k => { 
                if(document.getElementById(`tl-${k}`)) document.getElementById(`tl-${k}`).innerText = r[k].toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺"; 
            });
            const total = Object.values(r).reduce((a,b)=>a+b, 0);
            document.getElementById('total-val').innerText = total.toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
        }

        function saveMilestone() {
            let m = JSON.parse(localStorage.getItem('milestones')) || [];
            m.unshift({d: new Date().toLocaleString('tr-TR'), v: document.getElementById('total-val').innerText});
            localStorage.setItem('milestones', JSON.stringify(m));
            renderMilestones();
        }

        function renderMilestones() {
            const m = JSON.parse(localStorage.getItem('milestones')) || [];
            document.getElementById('milestone-list').innerHTML = m.map(x => `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333; font-size:0.75rem;"><span>${x.d}</span><b>${x.v}</b></div>`).join('');
        }

        window.onload = () => { renderAssets(); renderMilestones(); fetchRates(); setInterval(fetchRates, 60000); };
    </script>
</body>
</html>
