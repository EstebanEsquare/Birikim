<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siber Kasa v7.0</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1117">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #0b1117; --frame-color: #161b22; --neon-blue: #00d2ff; --cyber-green: #39FF14; --text-main: #c9d1d9; --input-bg: #1c2128; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 500px; background: var(--frame-color); border: 1px solid var(--neon-blue); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .total-value { font-size: 2.2rem; color: var(--cyber-green); font-family: monospace; font-weight: bold; }
        .asset-card { width: 100%; max-width: 500px; background: var(--frame-color); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        input { width: 90px; background: var(--input-bg); border: 1px solid #30363d; color: var(--cyber-green); padding: 8px; border-radius: 8px; text-align: center; }
        .rate-row { display: flex; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 15px; }
        .rate-box { flex:1; background: var(--input-bg); padding: 10px; border-radius: 10px; text-align: center; font-size: 0.8rem; border: 1px solid #333; }
        #debug { width:100%; max-width:500px; font-size:0.6rem; color:#666; background:#000; padding:10px; border-radius:5px; margin-top:10px; height:60px; overflow-y:auto; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 0.8rem; opacity: 0.7;">TOPLAM VARLIK</div>
        <div id="total-val" class="total-value">0,00 TL</div>
        <div id="status" style="font-size:0.6rem; margin-top:5px;">Bağlanıyor...</div>
    </div>

    <div class="rate-row">
        <div class="rate-box">USD<br><b id="rate-usd" style="color:var(--neon-blue)">...</b></div>
        <div class="rate-box">GRAM<br><b id="rate-gram" style="color:var(--neon-blue)">...</b></div>
        <div class="rate-box">ÇEYREK<br><b id="rate-ceyrek" style="color:var(--neon-blue)">...</b></div>
    </div>

    <div id="asset-list" style="width:100%; max-width:500px;"></div>

    <div id="debug">Sistem: Hazır.</div>

    <button onclick="saveMilestone()" style="width:100%; max-width:500px; height:50px; background:var(--neon-blue); border:none; border-radius:12px; margin-top:15px; font-weight:bold;">AYLIK KAYIT</button>

    <div id="milestone-list" style="width:100%; max-width:500px; margin-top:15px;"></div>

    <script>
        const log = (m) => { document.getElementById('debug').innerText += "\n> " + m; };
        let rates = { usd: 0, gram: 0, ceyrek: 0 };
        let myAssets = JSON.parse(localStorage.getItem('assets')) || { usd: 0, gram: 0, ceyrek: 0, nakit: 0 };

        async function fetchRates() {
            log("Veri çekme başladı...");
            // Proxy stratejisi: Google Apps Script üzerinden geçiş (En sağlam yol)
            const proxy = "https://api.allorigins.win/raw?url=";
            const target = encodeURIComponent("https://finans.truncgil.com/today.json");

            try {
                const response = await fetch(proxy + target);
                if(!response.ok) throw new Error("Proxy hatası");
                const data = await response.json();

                const parse = (v) => parseFloat(v.replace(".","").replace(",",".")) || 0;

                rates.usd = parse(data["ABD DOLARI"].Alış);
                rates.gram = parse(data["Gram Altın"].Alış);
                rates.ceyrek = parse(data["Çeyrek Altın"].Alış);

                document.getElementById('rate-usd').innerText = rates.usd.toFixed(2) + " ₺";
                document.getElementById('rate-gram').innerText = rates.gram.toFixed(2) + " ₺";
                document.getElementById('rate-ceyrek').innerText = rates.ceyrek.toFixed(0) + " ₺";

                document.getElementById('status').innerText = "Güncel: " + new Date().toLocaleTimeString();
                log("Veriler başarıyla alındı.");
                calculateTotal();
            } catch (e) {
                log("Hata: " + e.message);
                // Eğer proxy çökerse doğrudan çekmeyi dene (Bazı telefonlar buna izin verir)
                try {
                    log("Doğrudan deneme yapılıyor...");
                    const res = await fetch("https://finans.truncgil.com/today.json");
                    const d = await res.json();
                    // ... aynı parsing işlemleri
                } catch(e2) { log("Kritik: Tüm yollar kapalı."); }
            }
        }

        function renderAssets() {
            const container = document.getElementById('asset-list');
            const types = [{id:'usd', n:'Dolar ($)'}, {id:'gram', n:'Gram Altın'}, {id:'ceyrek', n:'Çeyrek Altın'}, {id:'nakit', n:'Nakit (TL)'}];
            container.innerHTML = '';
            types.forEach(a => {
                const div = document.createElement('div');
                div.className = 'asset-card';
                div.innerHTML = `<div>${a.n}</div><input type="number" value="${myAssets[a.id]}" oninput="updateAsset('${a.id}', this.value)"><div id="tl-${a.id}">0,00 ₺</div>`;
                container.appendChild(div);
            });
        }

        function updateAsset(id, v) { myAssets[id] = parseFloat(v) || 0; localStorage.setItem('assets', JSON.stringify(myAssets)); calculateTotal(); }

        function calculateTotal() {
            const r = { usd: myAssets.usd * rates.usd, gram: myAssets.gram * rates.gram, ceyrek: myAssets.ceyrek * rates.ceyrek, nakit: myAssets.nakit };
            Object.keys(r).forEach(k => { if(document.getElementById(`tl-${k}`)) document.getElementById(`tl-${k}`).innerText = r[k].toLocaleString('tr-TR') + " ₺"; });
            const total = Object.values(r).reduce((a,b)=>a+b, 0);
            document.getElementById('total-val').innerText = total.toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
        }

        function saveMilestone() {
            let m = JSON.parse(localStorage.getItem('milestones')) || [];
            m.unshift({d: new Date().toLocaleString('tr-TR'), v: document.getElementById('total-val').innerText});
            localStorage.setItem('milestones', JSON.stringify(m));
            renderMilestones();
        }

        function renderMilestones() {
            const m = JSON.parse(localStorage.getItem('milestones')) || [];
            document.getElementById('milestone-list').innerHTML = m.map(x => `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #333; font-size:0.7rem;"><span>${x.d}</span><b>${x.v}</b></div>`).join('');
        }

        window.onload = () => { renderAssets(); renderMilestones(); fetchRates(); setInterval(fetchRates, 60000); };
    </script>
</body>
</html>
