<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Siber Kasa v9.6</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1117">
    <style>
        :root { --bg: #0b1117; --card: #161b22; --blue: #00d2ff; --green: #39FF14; --text: #c9d1d9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 500px; background: var(--card); border: 1px solid var(--blue); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .total { font-size: 2.2rem; color: var(--green); font-family: monospace; font-weight: bold; }
        .asset-card { width: 100%; max-width: 500px; background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        input[type="number"] { width: 90px; background: #1c2128; border: 1px solid #333; color: var(--green); padding: 10px; border-radius: 8px; text-align: center; font-size: 1rem; }
        .rates { display: flex; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 15px; }
        .rate-box { flex:1; background: var(--card); padding: 10px; border-radius: 10px; text-align: center; font-size: 0.75rem; border: 1px solid #333; }
        
        .btn-main { width: 100%; max-width: 500px; height: 50px; background: var(--blue); border: none; border-radius: 15px; margin-top: 10px; font-weight: bold; color: #000; cursor: pointer; }
        .btn-main:active { opacity: 0.8; }
        .action-row { display: flex; gap: 10px; width: 100%; max-width: 500px; margin-top: 15px; }
        .btn-sub { flex: 1; height: 44px; background: #1c2128; border: 1px solid #333; border-radius: 12px; color: var(--text); font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .btn-sub:active { background: #2d333b; }
        
        .milestone-item { padding: 12px 10px; border-bottom: 1px solid #333; }
        .milestone-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; }
        .milestone-detail { font-size: 0.7rem; background: #0b1117; padding: 8px; border-radius: 8px; border: 1px solid #1c2128; }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .detail-row:last-child { margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 0.8rem; opacity: 0.7;">TOPLAM VARLIK (TL)</div>
        <div id="total-val" class="total">0,00 TL</div>
        <div id="status" style="font-size:0.6rem; margin-top:10px; color: var(--blue);">Veriler Güncelleniyor...</div>
    </div>

    <div class="rates">
        <div class="rate-box">İş Bankası USD<br><b id="rate-usd" style="font-size:0.95rem;">...</b></div>
        <div class="rate-box">YK Gram<br><b id="rate-gram" style="font-size:0.95rem;">...</b></div>
        <div class="rate-box">Çeyrek<br><b id="rate-ceyrek" style="font-size:0.95rem;">...</b></div>
    </div>

    <div id="asset-list" style="width:100%; max-width:500px;"></div>

    <button class="btn-main" onclick="saveMilestone()">AYLIK KAYIT OLUŞTUR</button>

    <div class="action-row">
        <button class="btn-sub" onclick="exportData()">💾 YEDEK AL (.txt)</button>
        <button class="btn-sub" onclick="document.getElementById('import-file').click()">📂 GERİ YÜKLE</button>
        <input type="file" id="import-file" style="display:none" accept=".txt, text/plain" onchange="importData(event)">
    </div>

    <div id="milestone-list" style="width:100%; max-width:500px; margin-top:20px; padding-bottom: 30px;"></div>

    <script>
        const GOOGLE_PROXY_URL = "https://script.google.com/macros/s/AKfycbxd8iKLp5urDIwyXRmnHAjqrxjQqfeXerSozDDOFTdzbAf3vhta6-7FvNdJBjwgN4B5Iw/exec";
        const KATSAYI_USD = 0.9708;
        const KATSAYI_GRAM = 0.9876;
        const KATSAYI_CEYREK = 1.0000;

        let rates = { usd: 0, gram: 0, ceyrek: 0 };
        let myAssets = JSON.parse(localStorage.getItem('assets')) || { usd: 0, gram: 0, ceyrek: 0, nakit: 0 };

        async function fetchRates() {
            try {
                const response = await fetch(GOOGLE_PROXY_URL, { redirect: "follow" });
                if(!response.ok) throw new Error("Ağ yanıtı olumsuz.");
                const data = await response.json();
                
                const parse = (v) => {
                    if(!v) return 0;
                    return parseFloat(v.replace(/\./g, "").replace(",", ".")) || 0;
                };
                
                let hamUsd = parse(data["USD"]["Alış"]);
                rates.usd = hamUsd * KATSAYI_USD;
                
                let hamGram = parse(data["gram-has-altin"]["Alış"]);
                rates.gram = hamGram * KATSAYI_GRAM; 
                
                let hamCeyrek = parse(data["ceyrek-altin"]["Alış"]);
                rates.ceyrek = hamCeyrek * KATSAYI_CEYREK;

                document.getElementById('rate-usd').innerText = rates.usd.toFixed(2) + " ₺";
                document.getElementById('rate-gram').innerText = rates.gram.toFixed(2) + " ₺";
                document.getElementById('rate-ceyrek').innerText = rates.ceyrek.toFixed(0) + " ₺";
                
                document.getElementById('status').innerText = "Son Senkronizasyon: " + new Date().toLocaleTimeString();
                calculateTotal();
            } catch (e) {
                document.getElementById('status').innerText = "Veri alınamıyor. Lütfen bekleyin...";
                console.error("Hata Detayı:", e);
            }
        }

        function renderAssets() {
            const container = document.getElementById('asset-list');
            const types = [{id:'usd', n:'Dolar ($)'}, {id:'gram', n:'Gram Altın'}, {id:'ceyrek', n:'Çeyrek Altın'}, {id:'nakit', n:'Nakit (TL)'}];
            container.innerHTML = '';
            types.forEach(a => {
                const div = document.createElement('div');
                div.className = 'asset-card';
                div.innerHTML = `<div>${a.n}</div><input type="number" inputmode="decimal" value="${myAssets[a.id]}" oninput="updateAsset('${a.id}', this.value)"> <div id="tl-${a.id}" style="font-weight:bold; width:110px; text-align:right;">0,00 ₺</div>`;
                container.appendChild(div);
            });
        }

        function updateAsset(id, v) { 
            myAssets[id] = parseFloat(v) || 0; 
            localStorage.setItem('assets', JSON.stringify(myAssets)); 
            calculateTotal(); 
        }

        function calculateTotal() {
            const r = { usd: myAssets.usd * rates.usd, gram: myAssets.gram * rates.gram, ceyrek: myAssets.ceyrek * rates.ceyrek, nakit: myAssets.nakit };
            Object.keys(r).forEach(k => { 
                if(document.getElementById(`tl-${k}`)) document.getElementById(`tl-${k}`).innerText = r[k].toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺"; 
            });
            const total = Object.values(r).reduce((a,b)=>a+b, 0);
            document.getElementById('total-val').innerText = total.toLocaleString('tr-TR', {minimumFractionDigits:2}) + " ₺";
        }

        function saveMilestone() {
            let m = JSON.parse(localStorage.getItem('milestones')) || [];
            
            let snapshot = {
                varliklar: { usd: myAssets.usd, gram: myAssets.gram, ceyrek: myAssets.ceyrek, nakit: myAssets.nakit },
                kurlar: { usd: rates.usd.toFixed(2), gram: rates.gram.toFixed(2), ceyrek: rates.ceyrek.toFixed(2) }
            };

            m.unshift({
                d: new Date().toLocaleString('tr-TR', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric'}), 
                v: document.getElementById('total-val').innerText,
                detay: snapshot
            });
            
            localStorage.setItem('milestones', JSON.stringify(m));
            renderMilestones();
        }

        function renderMilestones() {
            const m = JSON.parse(localStorage.getItem('milestones')) || [];
            document.getElementById('milestone-list').innerHTML = m.map(x => {
                let detayHtml = '';
                if(x.detay) {
                    const v = x.detay.varliklar || {};
                    const k = x.detay.kurlar || {};
                    
                    // Sadece kurlar varsa veya sadece varlıklar varsa hata vermemesi için koruma eklendi
                    const vText = v.usd !== undefined ? `<span style="color:#8b949e">Miktar:</span> <b>${v.usd}$</b> | <b>${v.gram}Gr</b> | <b>${v.ceyrek}Çey.</b> | <b>${v.nakit}₺</b>` : '';
                    const kText = k.usd !== undefined ? `<span style="color:var(--blue)">Kurlar:</span> <b>${k.usd}₺</b> | <b>${k.gram}₺</b> | <b>${k.ceyrek}₺</b>` : '';
                    
                    detayHtml = `<div class="milestone-detail">
                        ${vText ? `<div class="detail-row" style="color:#c9d1d9">${vText}</div>` : ''}
                        ${kText ? `<div class="detail-row" style="color:#00d2ff">${kText}</div>` : ''}
                    </div>`;
                }
                
                return `
                <div class="milestone-item">
                    <div class="milestone-header">
                        <span>${x.d}</span>
                        <b style="color:var(--green); font-size:1rem;">${x.v}</b>
                    </div>
                    ${detayHtml}
                </div>`;
            }).join('');
        }

        function exportData() {
            const dataToExport = {
                assets: JSON.parse(localStorage.getItem('assets')) || { usd: 0, gram: 0, ceyrek: 0, nakit: 0 },
                milestones: JSON.parse(localStorage.getItem('milestones')) || []
            };

            const dataStr = JSON.stringify(dataToExport, null, 2);
            const blob = new Blob([dataStr], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            
            const dateObj = new Date();
            const dateStr = dateObj.toISOString().split('T')[0];
            const fileName = `SiberKasa_Yedek_${dateStr}.txt`;

            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.assets) {
                        localStorage.setItem('assets', JSON.stringify(importedData.assets));
                        myAssets = importedData.assets; 
                    }
                    if (importedData.milestones) {
                        localStorage.setItem('milestones', JSON.stringify(importedData.milestones));
                    }
                    renderAssets();
                    renderMilestones();
                    calculateTotal();
                    alert("Yedek başarıyla geri yüklendi!");
                } catch (error) {
                    alert("Hata: Geçerli bir SiberKasa yedek dosyası seçilmedi.");
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }

        window.onload = () => { renderAssets(); renderMilestones(); fetchRates(); setInterval(fetchRates, 60000); };
    </script>
</body>
</html>
